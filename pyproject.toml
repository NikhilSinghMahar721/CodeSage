[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codesage"
version = "0.1.0"
description = "CodeSage: AI-powered Code Review & Repository Q&A"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "rank-bm25>=0.2.2",
    "tabulate>=0.9.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "google-genai>=0.1.1",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
codesage = "codesage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codesage*"]
